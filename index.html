<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Control de acceso del Bautizo y Primer Añito de Aldo Yosef.">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex,nofollow">

  <title>Aldo Yosef · Control de acceso</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --navy:#173b67;
      --navy-dark:#12345d;
      --blue:#5d84b1;
      --blue-soft:#edf4fb;
      --blue-soft-2:#f5f9fd;
      --blue-line:#d7e3ef;

      --text:#203b5c;
      --muted:#72849a;

      --line:#dce6ef;
      --white:#ffffff;

      --success:#2d8a60;
      --success-soft:#eaf7f0;

      --pending:#25875c;
      --pending-soft:#e8f6ef;

      --danger:#a34440;
      --danger-soft:#fff3f2;

      --shadow:0 10px 30px rgba(31,73,111,.09);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      margin:0;
      width:100%;
      min-height:100%;
      background:#f3f8fc;
      color:var(--text);
    }

    body{
      font-family:"DM Sans",sans-serif;
    }

    button,
    input{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    button:disabled{
      cursor:not-allowed;
      opacity:.55;
    }

    .hidden{
      display:none!important;
    }

    /* =========================================================
       CONTENEDOR GENERAL
       ========================================================= */

    .page{
      width:100%;
      min-height:100vh;
      display:flex;
      justify-content:center;
      padding:26px 18px 45px;
    }

    .shell{
      width:100%;
      max-width:1080px;
    }

    /* =========================================================
       DECORACIÓN DE HOJAS
       ========================================================= */

    .decorated{
      position:relative;
      overflow:hidden;
    }

    .leaf-decoration{
      position:absolute;
      top:14px;
      right:16px;
      width:90px;
      height:85px;
      pointer-events:none;
      opacity:.45;
    }

    .leaf-decoration i{
      position:absolute;
      color:#9bb6cf;
    }

    .leaf-1{
      top:5px;
      right:4px;
      transform:rotate(30deg);
    }

    .leaf-2{
      top:28px;
      right:31px;
      transform:rotate(-25deg);
    }

    .leaf-3{
      top:48px;
      right:3px;
      transform:rotate(48deg);
    }

    /* =========================================================
       TARJETAS
       ========================================================= */

    .card{
      background:var(--white);
      border:1px solid var(--blue-line);
      border-radius:22px;
      box-shadow:var(--shadow);
    }

    /* =========================================================
       BUSCADOR
       ========================================================= */

    .search-card{
      padding:25px 28px 28px;
      background:#ffffff;
    }

    .search-label-row{
      display:flex;
      align-items:center;
      gap:13px;
      margin-bottom:12px;
    }

    .search-icon-box{
      width:45px;
      height:45px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex:none;

      color:var(--navy);
      background:#e7f0f9;
      border-radius:13px;
    }

    .search-icon-box svg{
      width:24px;
      height:24px;
      stroke-width:2;
    }

    .label{
      display:block;
      margin:0;
      color:var(--navy);
      font-size:18px;
      font-weight:600;
    }

    .search-row{
      display:grid;
      grid-template-columns:minmax(0,1fr) 320px;
      gap:15px;
    }

    .search-input-wrap{
      position:relative;
    }

    .search-row input{
      width:100%;
      height:66px;
      padding:0 48px 0 22px;

      color:var(--navy);
      background:#fff;

      border:2px solid #c9d8e7;
      border-radius:17px;

      outline:none;

      font-size:21px;
      font-weight:500;

      transition:.2s ease;
    }

    .search-row input:focus{
      border-color:#6e94bb;
      box-shadow:0 0 0 4px rgba(93,132,177,.10);
    }

    .search-clear{
      position:absolute;
      top:50%;
      right:16px;

      width:30px;
      height:30px;

      transform:translateY(-50%);

      border:0;
      background:transparent;
      color:#74869a;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    .search-clear svg{
      width:21px;
      height:21px;
    }

    .primary{
      min-height:66px;
      padding:0 22px;

      border:0;
      border-radius:17px;

      background:var(--navy);
      color:#fff;

      font-size:16px;
      font-weight:700;

      letter-spacing:.02em;

      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;

      transition:.2s ease;
    }

    .primary svg{
      width:24px;
      height:24px;
      stroke-width:2.4;
    }

    .primary:hover:not(:disabled){
      background:var(--navy-dark);
      transform:translateY(-1px);
    }

    .search-status{
      min-height:18px;
      margin-top:9px;

      color:var(--muted);
      font-size:12px;
    }

    .search-status.error{
      color:var(--danger);
    }

    /* =========================================================
       RESULTADO DE INVITACIÓN
       ========================================================= */

    .result-card{
      margin-top:22px;
    }

    .result-head{
      position:relative;
      padding:27px 34px 25px;

      background:#edf4fb;
      border-bottom:1px solid var(--blue-line);
    }

    .result-number{
      margin:0;

      color:#315a84;

      font-size:16px;
      font-weight:700;

      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .result-family{
      margin:5px 0 0;

      color:var(--navy);

      font-size:25px;
      font-weight:600;
    }

    .result-main{
      margin-top:20px;

      display:grid;
      grid-template-columns:minmax(260px,1fr) minmax(450px,1.25fr);
      gap:25px;

      align-items:center;
    }

    /* =========================================================
       MESA
       ========================================================= */

    .table-area{
      display:flex;
      align-items:center;
      gap:17px;
    }

    .table-icon{
      width:75px;
      height:75px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:var(--navy);
      background:transparent;
    }

    .table-icon svg{
      width:68px;
      height:68px;
      stroke-width:1.7;
    }

    .table-label{
      margin:0;

      color:#315a84;

      font-size:17px;
      font-weight:600;

      letter-spacing:.05em;
      text-transform:uppercase;
    }

    .table-number{
      margin:0;

      color:var(--navy);

      font-size:58px;
      line-height:.95;
      font-weight:700;
    }

    .table-number.unassigned{
      font-size:27px;
    }

    /* =========================================================
       MÉTRICAS
       ========================================================= */

    .metrics{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:0;

      background:#ffffff;
      border-radius:18px;

      overflow:hidden;

      box-shadow:0 5px 18px rgba(32,68,101,.055);
    }

    .metric{
      min-height:94px;
      padding:15px 18px;

      display:grid;
      grid-template-columns:35px 1fr;
      grid-template-rows:auto auto;

      align-items:center;

      border-right:1px solid var(--blue-line);
    }

    .metric:last-child{
      border-right:0;
    }

    .metric-icon{
      grid-row:1 / span 2;

      width:31px;
      height:31px;

      color:#315a84;
    }

    .metric-icon svg{
      width:29px;
      height:29px;
      stroke-width:1.8;
    }

    .metric span{
      color:#72849a;

      font-size:12px;
      font-weight:600;

      line-height:1.1;
    }

    .metric strong{
      margin-top:2px;

      color:var(--navy);

      font-size:27px;
      line-height:1;
      font-weight:700;
    }

    /* =========================================================
       PERSONAS
       ========================================================= */

    .members{
      padding:26px 34px 32px;
    }

    .members-title{
      margin:0 0 14px;

      color:var(--navy);

      font-size:18px;
      font-weight:600;
    }

    .select-all{
      display:flex;
      align-items:center;
      gap:10px;

      width:max-content;

      margin-bottom:12px;
      padding:4px 8px;

      color:#65788e;

      font-size:14px;
      font-weight:500;

      cursor:pointer;
    }

    .select-all input{
      width:20px;
      height:20px;

      accent-color:var(--navy);
    }

    .member-list{
      display:grid;
      gap:11px;
    }

    .member{
      min-height:67px;

      display:flex;
      align-items:center;
      gap:14px;

      padding:10px 16px;

      border:1px solid #d9e4ee;
      border-radius:16px;

      background:#fff;

      transition:.18s ease;
    }

    .member.pending{
      cursor:pointer;
    }

    .member.pending:hover{
      border-color:#a8c1d9;
      box-shadow:0 4px 14px rgba(32,68,101,.06);
    }

    .member.entered{
      background:#f0f8f4;
      border-color:#cae5d7;
    }

    .member input{
      width:22px;
      height:22px;

      accent-color:var(--navy);

      flex:none;
    }

    .member-person-icon{
      width:42px;
      height:42px;

      display:flex;
      align-items:center;
      justify-content:center;

      flex:none;

      color:#6685a5;
      background:#eaf1f8;

      border-radius:50%;
    }

    .member-person-icon svg{
      width:23px;
      height:23px;
      stroke-width:1.8;
    }

    .member-name{
      flex:1;

      color:var(--navy);

      font-size:16px;
      font-weight:600;
    }

    .badge{
      flex:none;

      padding:8px 13px;

      border-radius:999px;

      font-size:11px;
      font-weight:700;
    }

    .badge.entered{
      color:#247d53;
      background:#dcefe5;
    }

    .badge.pending{
      color:#247d53;
      background:#e3f4eb;
    }

    .child-tag{
      display:inline-flex;
      align-items:center;

      padding:5px 9px;

      border-radius:999px;

      color:#6f5928;
      background:#fff5d9;
      border:1px solid #ead7a3;

      font-size:10px;
      font-weight:700;

      letter-spacing:.03em;
      text-transform:uppercase;

      white-space:nowrap;
    }

    .register{
      width:100%;
      margin-top:18px;
    }

    /* =========================================================
       AVISO DE INGRESO
       ========================================================= */

    .notice{
      margin-top:18px;

      padding:18px 20px;

      border-radius:17px;
      border:1px solid #cfe4d6;

      background:var(--success-soft);
      color:var(--success);

      box-shadow:0 8px 22px rgba(47,111,78,.06);
    }

    .notice-row{
      display:flex;
      gap:11px;
      align-items:flex-start;
    }

    .notice-row svg{
      width:24px;
      height:24px;
      flex:none;
    }

    .notice h3{
      margin:0;
      font-size:17px;
    }

    .notice p{
      margin:4px 0 0;
      font-size:13px;
      line-height:1.5;
    }

    .error-box{
      margin-top:14px;
      padding:12px 14px;

      color:var(--danger);
      background:var(--danger-soft);

      border:1px solid #efcbc7;
      border-radius:12px;

      font-size:12px;
    }

    /* =========================================================
       CONTADOR GLOBAL
       ========================================================= */

    .counter{
      position:relative;

      margin-top:22px;
      padding:25px 34px 28px;

      text-align:center;

      overflow:hidden;
    }

    .counter-title{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:11px;

      color:#315a84;

      font-size:15px;
      font-weight:700;

      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .counter-title svg{
      width:30px;
      height:30px;
      stroke-width:1.8;
    }

    .counter-number{
      display:block;

      margin-top:14px;

      color:var(--navy);

      font-size:54px;
      line-height:1;
      font-weight:700;
    }

    .counter small{
      display:block;

      margin-top:2px;

      color:#72849a;

      font-size:16px;
    }

    .counter-breakdown{
      display:grid;
      grid-template-columns:1fr 1fr;

      margin-top:20px;
      padding-top:18px;

      border-top:1px solid var(--blue-line);
    }

    .counter-breakdown div{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:13px;

      min-height:57px;
    }

    .counter-breakdown div:first-child{
      border-right:1px solid var(--blue-line);
    }

    .counter-person-icon{
      width:35px;
      height:35px;

      color:#6685a5;
    }

    .counter-person-icon svg{
      width:35px;
      height:35px;
      stroke-width:1.7;
    }

    .counter-info{
      text-align:left;
    }

    .counter-breakdown b{
      display:block;

      color:var(--navy);

      font-size:24px;
      line-height:1;
    }

    .counter-breakdown em{
      display:block;

      margin-top:4px;

      color:#72849a;

      font-size:11px;
      font-style:normal;
      font-weight:700;

      letter-spacing:.08em;
      text-transform:uppercase;
    }

    /* =========================================================
       FOOTER
       ========================================================= */

    footer{
      padding:22px 0 0;

      text-align:center;

      color:#91a0af;

      font-size:10px;
      line-height:1.5;
    }

    /* =========================================================
       TABLET
       ========================================================= */

    @media(max-width:850px){

      .result-main{
        grid-template-columns:1fr;
        gap:18px;
      }

      .table-area{
        justify-content:center;
      }

      .search-row{
        grid-template-columns:1fr 260px;
      }
    }

    /* =========================================================
       MÓVIL
       ========================================================= */

    @media(max-width:620px){

      .page{
        padding:15px 10px 30px;
      }

      .search-card{
        padding:19px;
        border-radius:18px;
      }

      .search-label-row{
        gap:10px;
      }

      .search-icon-box{
        width:40px;
        height:40px;
      }

      .label{
        font-size:15px;
      }

      .search-row{
        grid-template-columns:1fr;
        gap:10px;
      }

      .search-row input{
        height:57px;
        font-size:18px;
        border-radius:14px;
      }

      .primary{
        min-height:57px;
        border-radius:14px;
        font-size:14px;
      }

      .result-card{
        border-radius:18px;
      }

      .result-head{
        padding:21px 18px 20px;
      }

      .result-number{
        font-size:13px;
      }

      .result-family{
        font-size:21px;
      }

      .result-main{
        margin-top:18px;
      }

      .table-area{
        justify-content:flex-start;
      }

      .table-icon{
        width:59px;
        height:59px;
      }

      .table-icon svg{
        width:55px;
        height:55px;
      }

      .table-label{
        font-size:13px;
      }

      .table-number{
        font-size:45px;
      }

      .table-number.unassigned{
        font-size:23px;
      }

      .metrics{
        grid-template-columns:repeat(3,1fr);
        border-radius:14px;
      }

      .metric{
        min-height:82px;
        padding:11px 8px;

        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;

        text-align:center;
        gap:4px;
      }

      .metric-icon{
        width:25px;
        height:25px;
      }

      .metric-icon svg{
        width:23px;
        height:23px;
      }

      .metric span{
        font-size:9px;
      }

      .metric strong{
        font-size:22px;
      }

      .members{
        padding:21px 18px 23px;
      }

      .members-title{
        font-size:15px;
      }

      .member{
        min-height:61px;
        padding:9px 10px;
        gap:9px;
      }

      .member-person-icon{
        width:37px;
        height:37px;
      }

      .member-person-icon svg{
        width:20px;
        height:20px;
      }

      .member-name{
        font-size:14px;
      }

      .badge{
        padding:6px 9px;
        font-size:9px;
      }

      .child-tag{
        display:none;
      }

      .counter{
        padding:21px 18px 23px;
        border-radius:18px;
      }

      .counter-title{
        font-size:12px;
      }

      .counter-number{
        font-size:47px;
      }

      .counter-breakdown div{
        gap:8px;
      }

      .counter-breakdown b{
        font-size:21px;
      }
    }

    @media(max-width:390px){

      .metric span{
        font-size:8px;
      }

      .metric strong{
        font-size:20px;
      }

      .member-name{
        font-size:13px;
      }

      .badge{
        padding:5px 7px;
        font-size:8px;
      }
    }
  </style>
</head>

<body>

<main class="page">
  <div class="shell">

    <!-- =====================================================
         BUSCADOR
         ===================================================== -->

    <section class="card search-card decorated" aria-label="Buscar invitación">

      <div class="leaf-decoration" aria-hidden="true">
        <i class="leaf-1" data-lucide="leaf"></i>
        <i class="leaf-2" data-lucide="leaf"></i>
        <i class="leaf-3" data-lucide="leaf"></i>
      </div>

      <div class="search-label-row">

        <div class="search-icon-box">
          <i data-lucide="briefcase-business"></i>
        </div>

        <label for="invitation-search" class="label">
          Ingresa número de invitación:
        </label>

      </div>

      <form id="search-form" class="search-row">

        <div class="search-input-wrap">

          <input
            id="invitation-search"
            type="search"
            inputmode="numeric"
            autocomplete="off"
            enterkeyhint="search"
            placeholder="Ej. 25"
            aria-label="Número de invitación"
          >

          <button
            id="clear-search"
            type="button"
            class="search-clear"
            aria-label="Limpiar búsqueda"
          >
            <i data-lucide="x"></i>
          </button>

        </div>

        <button
          id="search-button"
          type="submit"
          class="primary"
        >
          <i data-lucide="search"></i>
          <span>BUSCAR INVITACIÓN</span>
        </button>

      </form>

      <div
        id="search-status"
        class="search-status"
        role="status"
        aria-live="polite"
      ></div>

    </section>


    <!-- =====================================================
         RESULTADO DE INVITACIÓN
         ===================================================== -->

    <section
      id="result-card"
      class="card result-card hidden"
      aria-live="polite"
    >

      <div class="result-head decorated">

        <div class="leaf-decoration" aria-hidden="true">
          <i class="leaf-1" data-lucide="leaf"></i>
          <i class="leaf-2" data-lucide="leaf"></i>
          <i class="leaf-3" data-lucide="leaf"></i>
        </div>

        <p id="result-number" class="result-number"></p>

        <!-- AQUÍ APARECE EL NOMBRE DE LA FAMILIA -->
        <h2 id="result-family" class="result-family"></h2>


        <div class="result-main">

          <!-- MESA -->

          <div class="table-area">

            <div class="table-icon">
              <i data-lucide="table-2"></i>
            </div>

            <div>
              <p class="table-label">Mesa</p>

              <p
                id="table-number"
                class="table-number"
              >
                —
              </p>
            </div>

          </div>


          <!-- MÉTRICAS -->

          <div class="metrics">

            <div class="metric">

              <div class="metric-icon">
                <i data-lucide="ticket"></i>
              </div>

              <span>Boletos</span>
              <strong id="assigned-count">0</strong>

            </div>


            <div class="metric">

              <div class="metric-icon">
                <i data-lucide="user-round-check"></i>
              </div>

              <span>Ingresaron</span>
              <strong id="entered-count">0</strong>

            </div>


            <div class="metric">

              <div class="metric-icon">
                <i data-lucide="clock-3"></i>
              </div>

              <span>Pendientes</span>
              <strong id="pending-count">0</strong>

            </div>

          </div>

        </div>

      </div>


      <!-- ===================================================
           PERSONAS
           =================================================== -->

      <div class="members">

        <p class="members-title">
          Selecciona a las personas que están ingresando:
        </p>


        <label
          id="select-all-wrap"
          class="select-all hidden"
        >

          <input
            id="select-all"
            type="checkbox"
          >

          Seleccionar todos los pendientes

        </label>


        <div
          id="member-list"
          class="member-list"
        ></div>


        <div
          id="selection-error"
          class="error-box hidden"
        ></div>


        <button
          id="register-button"
          type="button"
          class="primary register"
        >
          <i data-lucide="user-round-plus"></i>
          <span>REGISTRAR INGRESO</span>
        </button>

      </div>

    </section>


    <!-- =====================================================
         AVISO
         ===================================================== -->

    <section
      id="success-box"
      class="notice hidden"
      aria-live="polite"
    >

      <div class="notice-row">

        <i data-lucide="circle-check"></i>

        <div>

          <h3>Ingreso registrado</h3>

          <p id="success-text"></p>

        </div>

      </div>

    </section>


    <!-- =====================================================
         CONTADOR GLOBAL
         ===================================================== -->

    <aside
      class="card counter decorated"
      aria-label="Contador de ingresos"
    >

      <div class="leaf-decoration" aria-hidden="true">
        <i class="leaf-1" data-lucide="leaf"></i>
        <i class="leaf-2" data-lucide="leaf"></i>
        <i class="leaf-3" data-lucide="leaf"></i>
      </div>


      <div class="counter-title">
        <i data-lucide="bar-chart-3"></i>
        <span>Ingresos registrados</span>
      </div>


      <strong
        id="global-count"
        class="counter-number"
      >
        0
      </strong>

      <small>personas</small>


      <div class="counter-breakdown">

        <div>

          <div class="counter-person-icon">
            <i data-lucide="user-round"></i>
          </div>

          <div class="counter-info">
            <b id="adult-count">0</b>
            <em>Adultos</em>
          </div>

        </div>


        <div>

          <div class="counter-person-icon">
            <i data-lucide="baby"></i>
          </div>

          <div class="counter-info">
            <b id="child-count">0</b>
            <em>Niños</em>
          </div>

        </div>

      </div>

    </aside>


    <footer>
      Uso exclusivo para el control de acceso del evento.<br>
      © 2026 FM · Todos los derechos reservados.
    </footer>

  </div>
</main>


<script>
(function(){
  "use strict";

  const SUPABASE_URL = "https://ezqerdrtenbzahnxhnzi.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_TDbgtrrAqEMXJTTRdvDJcg_qPqHwueC";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);

  let currentInvitation = null;
  let resetTimer = null;

  function normalize(value){
    return String(value == null ? "" : value)
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .replace(/\s+/g," ")
      .trim();
  }

  function escapeHtml(value){
    return String(value == null ? "" : value).replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c]));
  }

  function show(id){
    $(id).classList.remove("hidden");
  }

  function hide(id){
    $(id).classList.add("hidden");
  }

  function setSearchStatus(text, isError=false){
    const el = $("search-status");

    el.textContent = text;

    el.classList.toggle("error", isError);
  }

  function clearSelectionError(){
    $("selection-error").textContent = "";

    hide("selection-error");
  }

  function resetForNextSearch(){

    clearTimeout(resetTimer);

    currentInvitation = null;

    $("invitation-search").value = "";

    $("member-list").replaceChildren();

    $("select-all").checked = false;

    hide("select-all-wrap");
    hide("result-card");
    hide("success-box");

    clearSelectionError();

    setSearchStatus("");

    $("invitation-search").focus();
  }

  function getEnteredNames(record){
    return (record.ingresos || [])
      .map(item => item.nombre_integrante);
  }

  function getChildNames(record){
    return Array.isArray(record && record.ninos)
      ? record.ninos
      : [];
  }

  function isChild(record, name){

    const target = normalize(name);

    return getChildNames(record)
      .some(child => normalize(child) === target);
  }

  function isEntered(enteredNames, name){

    const target = normalize(name);

    return enteredNames.some(
      item => normalize(item) === target
    );
  }

  function displayFamily(record){

    const members = record.integrantes || [];

    return record.familia ||
      (members.length === 1 ? members[0] : "Invitación");
  }


  async function refreshGlobalCount(){

    const { data, error } =
      await db.rpc("resumen_ingresos_control");

    if (error){

      console.error(
        "No se pudo actualizar el contador:",
        error
      );

      return;
    }

    const summary =
      Array.isArray(data) && data.length
        ? data[0]
        : null;

    $("global-count").textContent =
      summary
        ? Number(summary.total_ingresos || 0)
        : 0;

    $("adult-count").textContent =
      summary
        ? Number(summary.adultos_ingresados || 0)
        : 0;

    $("child-count").textContent =
      summary
        ? Number(summary.ninos_ingresados || 0)
        : 0;
  }


  async function searchInvitation(number){

    clearTimeout(resetTimer);

    hide("success-box");
    hide("result-card");

    clearSelectionError();

    setSearchStatus("Buscando…");

    const searched =
      String(number == null ? "" : number).trim();

    if (!searched){

      setSearchStatus(
        "Ingresa un número de invitación.",
        true
      );

      return;
    }

    const { data, error } =
      await db.rpc(
        "buscar_invitacion_control",
        {
          p_numero: searched
        }
      );

    if (error){

      console.error(error);

      setSearchStatus(
        "No fue posible realizar la búsqueda. Inténtalo nuevamente.",
        true
      );

      return;
    }

    const record =
      Array.isArray(data) && data.length
        ? data[0]
        : null;

    if (!record){

      currentInvitation = null;

      setSearchStatus(
        "Número de invitación no localizado.",
        true
      );

      return;
    }

    currentInvitation = record;

    setSearchStatus("");

    renderInvitation(record);
  }


  function renderInvitation(record){

    const members =
      Array.isArray(record.integrantes)
        ? record.integrantes
        : [];

    const enteredNames =
      getEnteredNames(record);

    const assigned =
      Number(record.boletos_asignados || 0);

    const enteredCount =
      enteredNames.length;

    const pendingCount =
      Math.max(
        0,
        assigned - enteredCount
      );


    $("result-number").textContent =
      "INVITACIÓN " + record.numero_invitacion;


    $("result-family").textContent =
      displayFamily(record);


    const mesa =
      record.mesa_asignada ??
      record.mesa ??
      record.numero_mesa ??
      "";


    const tableElement =
      $("table-number");


    tableElement.textContent =
      mesa
        ? mesa
        : "Por asignar";


    tableElement.classList.toggle(
      "unassigned",
      !mesa
    );


    $("assigned-count").textContent =
      assigned;

    $("entered-count").textContent =
      enteredCount;

    $("pending-count").textContent =
      pendingCount;


    const list =
      $("member-list");

    list.replaceChildren();


    let selectableCount = 0;


    members.forEach(name => {

      const entered =
        isEntered(
          enteredNames,
          name
        );

      const child =
        isChild(
          record,
          name
        );


      const label =
        document.createElement("label");


      label.className =
        "member " +
        (entered
          ? "entered"
          : "pending");


      const childTag =
        child
          ? '<span class="child-tag">Niño</span>'
          : "";


      if (entered){

        label.innerHTML = [

          '<i data-lucide="circle-check" style="width:23px;height:23px;color:#2d8a60;flex:none"></i>',

          '<span class="member-person-icon">',
          '<i data-lucide="user-round"></i>',
          '</span>',

          '<span class="member-name">',
          escapeHtml(name),
          '</span>',

          childTag,

          '<span class="badge entered">Ingresó</span>'

        ].join("");

      } else {

        selectableCount++;

        label.innerHTML = [

          '<input class="member-check" type="checkbox" value="',
          escapeHtml(name),
          '">',

          '<span class="member-person-icon">',
          '<i data-lucide="user-round"></i>',
          '</span>',

          '<span class="member-name">',
          escapeHtml(name),
          '</span>',

          childTag,

          '<span class="badge pending">Pendiente</span>'

        ].join("");
      }


      list.appendChild(label);

    });


    if (selectableCount > 1)
      show("select-all-wrap");
    else
      hide("select-all-wrap");


    $("select-all").checked = false;


    $("register-button").disabled =
      selectableCount === 0;


    $("register-button").innerHTML =
      selectableCount === 0
        ? '<i data-lucide="circle-check"></i><span>TODOS LOS INGRESOS FUERON REGISTRADOS</span>'
        : '<i data-lucide="user-round-plus"></i><span>REGISTRAR INGRESO</span>';


    show("result-card");


    if (window.lucide)
      window.lucide.createIcons();
  }


  /* =========================================================
     BUSCAR
     ========================================================= */

  $("search-form").addEventListener(
    "submit",
    event => {

      event.preventDefault();

      searchInvitation(
        $("invitation-search").value
      );
    }
  );


  let searchTypingTimer = null;


  $("invitation-search").addEventListener(
    "input",
    () => {

      clearTimeout(searchTypingTimer);

      const value =
        $("invitation-search")
          .value
          .trim();


      if (!value){

        currentInvitation = null;

        hide("result-card");
        hide("success-box");

        clearSelectionError();

        setSearchStatus("");

        return;
      }


      setSearchStatus("Buscando…");


      searchTypingTimer =
        setTimeout(
          () => {
            searchInvitation(value);
          },
          450
        );
    }
  );


  /* =========================================================
     BOTÓN LIMPIAR
     ========================================================= */

  $("clear-search").addEventListener(
    "click",
    () => {

      $("invitation-search").value = "";

      currentInvitation = null;

      hide("result-card");
      hide("success-box");

      clearSelectionError();

      setSearchStatus("");

      $("invitation-search").focus();
    }
  );


  /* =========================================================
     SELECCIONAR TODOS
     ========================================================= */

  $("select-all").addEventListener(
    "change",
    () => {

      document
        .querySelectorAll(".member-check")
        .forEach(input => {

          input.checked =
            $("select-all").checked;

        });
    }
  );


  $("member-list").addEventListener(
    "change",
    event => {

      if (
        !event.target.classList.contains(
          "member-check"
        )
      ){
        return;
      }


      const checks =
        [
          ...document.querySelectorAll(
            ".member-check"
          )
        ];


      const selected =
        checks.filter(
          x => x.checked
        ).length;


      $("select-all").checked =
        checks.length > 0 &&
        selected === checks.length;


      $("select-all").indeterminate =
        selected > 0 &&
        selected < checks.length;
    }
  );


  /* =========================================================
     REGISTRAR INGRESO
     ========================================================= */

  $("register-button").addEventListener(
    "click",
    async () => {

      if (!currentInvitation)
        return;


      const selected =
        [
          ...document.querySelectorAll(
            ".member-check:checked"
          )
        ].map(
          input => input.value
        );


      if (!selected.length){

        $("selection-error").textContent =
          "Selecciona por lo menos una persona para registrar su ingreso.";

        show("selection-error");

        return;
      }


      clearSelectionError();


      const button =
        $("register-button");


      const originalText =
        button.textContent;


      button.disabled = true;

      button.textContent =
        "REGISTRANDO…";


      const successful = [];
      const failed = [];


      for (const name of selected){

        const { data, error } =
          await db.rpc(
            "registrar_ingreso_control",
            {
              p_invitacion_id:
                currentInvitation.invitacion_id,

              p_nombre_integrante:
                name
            }
          );


        if (error){

          console.error(error);

          failed.push(name);

          continue;
        }


        const result =
          data || {};


        if (result.ok === true)
          successful.push(name);
        else
          failed.push(name);
      }


      button.disabled = false;

      button.textContent =
        originalText;


      if (!successful.length){

        $("selection-error").textContent =
          "No fue posible registrar el ingreso. Verifica e inténtalo nuevamente.";

        show("selection-error");

        return;
      }


      await refreshGlobalCount();


      $("success-text").textContent =
        successful.length === 1
          ? "1 persona ingresó correctamente."
          : successful.length +
            " personas ingresaron correctamente.";


      show("success-box");

      hide("result-card");


      if (failed.length){

        console.warn(
          "No se registraron:",
          failed
        );
      }


      resetTimer =
        setTimeout(
          resetForNextSearch,
          1800
        );
    }
  );


  /* =========================================================
     INICIALIZACIÓN
     ========================================================= */

  refreshGlobalCount();


  if (window.lucide){
    window.lucide.createIcons();
  }


  $("invitation-search").focus();

})();
</script>
